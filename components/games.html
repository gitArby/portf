<!-- Games View -->
        <div id="games-view" class="dashboard-view">
            <section id="games" class="container reveal">
                <h3 id="games-title" class="reveal-stagger" style="--stagger-delay: 1">Minihry & Zábava</h3>
                <p class="container-text reveal-stagger" id="games-subtitle" style="--stagger-delay: 2">Klasický kyber-had na odreagování a hacker hledání min pro trénink síťového myšlení.</p>
                
                <div class="calc-hub reveal-card" style="--stagger-delay: 3; max-width: 650px;">
                    <div class="calc-tabs">
                        <button class="game-tab-btn active" data-game-tab="snake" id="tab-btn-snake">Kybernetický had</button>
                        <button class="game-tab-btn" data-game-tab="mines" id="tab-btn-mines">Hacker Hledání min</button>
                        <button class="game-tab-btn" data-game-tab="type" id="tab-btn-type">Obrana firewallu</button>
                    </div>
                    
                    <div class="calc-content">
                        <!-- CYBER SNAKE GAME -->
                        <div class="game-view active" id="view-game-snake">
                            <div class="game-scoreboard">
                                <div class="score-box"><span id="lbl-snake-score">Skóre:</span> <strong id="snake-score">0</strong></div>
                                <div class="score-box"><span id="lbl-snake-highscore">Nejlepší:</span> <strong id="snake-highscore">0</strong></div>
                                <div class="score-box">
                                    <label for="snake-speed" id="lbl-snake-difficulty" style="display:inline; margin-right: 0.5rem; text-transform:uppercase; font-size:0.75rem; font-weight:700; color:var(--text-muted);">Obtížnost:</label>
                                    <select id="snake-speed" style="width: auto; padding: 0.2rem 0.5rem; display: inline-block;">
                                        <option value="120">Easy</option>
                                        <option value="80" selected>Medium</option>
                                        <option value="50">Hard</option>
                                    </select>
                                </div>
                            </div>
                            
                            <div class="canvas-wrapper">
                                <canvas id="snake-canvas" width="400" height="400"></canvas>
                                <div class="game-overlay" id="snake-overlay">
                                    <div class="overlay-text" id="snake-overlay-text">Stiskněte START pro spuštění</div>
                                    <button class="btn" id="btn-snake-start" style="margin-top: 1rem; padding: 0.6rem 1.8rem; font-size: 0.8rem;">START</button>
                                </div>
                            </div>
                            
                            <!-- MOBILE D-PAD -->
                            <div class="mobile-dpad">
                                <div class="dpad-row"><button class="dpad-btn" id="dpad-up"><i class="fa-solid fa-caret-up"></i></button></div>
                                <div class="dpad-row">
                                    <button class="dpad-btn" id="dpad-left"><i class="fa-solid fa-caret-left"></i></button>
                                    <div class="dpad-center"></div>
                                    <button class="dpad-btn" id="dpad-right"><i class="fa-solid fa-caret-right"></i></button>
                                </div>
                                <div class="dpad-row"><button class="dpad-btn" id="dpad-down"><i class="fa-solid fa-caret-down"></i></button></div>
                            </div>
                        </div>
                        
                        <!-- HACKER MINESWEEPER GAME -->
                        <div class="game-view" id="view-game-mines">
                            <div class="game-scoreboard">
                                <div class="score-box"><span id="lbl-mines-nodes">Uzly:</span> <strong id="mines-count">100</strong></div>
                                <div class="score-box"><span id="lbl-mines-flags">Štíty:</span> <strong id="mines-flags">15</strong></div>
                                <div class="score-box"><span id="lbl-mines-time">Čas:</span> <strong id="mines-time">0</strong>s</div>
                            </div>
                            
                            <div class="mines-control-row">
                                <button class="btn btn-action" id="btn-mines-reset" style="padding: 0.5rem 1.2rem; font-size: 0.75rem;">RESTART</button>
                                <button class="btn btn-action" id="btn-mines-mode" style="padding: 0.5rem 1.2rem; font-size: 0.75rem; border-color: var(--accent-color); color: var(--accent-color);">
                                    <i class="fa-solid fa-shield-halved"></i> <span id="btn-mines-mode-text">Režim: Odkrýt</span>
                                </button>
                            </div>

                            <div class="mines-grid-wrapper">
                                <div id="mines-board" class="mines-board"></div>
                            </div>
                        </div>
                        
                        <!-- DEFEND THE FIREWALL TYPING GAME -->
                        <div class="game-view" id="view-game-type">
                            <div class="game-scoreboard">
                                <div class="score-box"><span id="lbl-type-score">Skóre:</span> <strong id="type-score">0</strong></div>
                                <div class="score-box"><span id="lbl-type-highscore">Nejlepší:</span> <strong id="type-highscore">0</strong></div>
                                <div class="score-box" style="flex-grow: 1; max-width: 250px; justify-content: flex-end;">
                                    <span id="lbl-type-integrity">Integrita:</span>
                                    <div class="integrity-bar-container" style="flex-grow: 1; height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; max-width: 120px; margin-left: 0.5rem; margin-right: 0.5rem;">
                                        <div id="type-integrity-fill" style="width: 100%; height: 100%; background: var(--accent-color); transition: width 0.3s ease, background-color 0.3s ease;"></div>
                                    </div>
                                    <strong id="type-integrity-text" style="font-size: 0.8rem; min-width: 32px; text-align: right;">100%</strong>
                                </div>
                            </div>
                            
                            <div class="type-screen-wrapper">
                                <div id="type-terminal-screen"></div>
                                <div class="game-overlay" id="type-overlay">
                                    <div class="overlay-text" id="type-overlay-text">Stiskněte START pro spuštění</div>
                                    <button class="btn" id="btn-type-start" style="margin-top: 1rem; padding: 0.6rem 1.8rem; font-size: 0.8rem;">START</button>
                                </div>
                            </div>

                            <div class="type-input-row" style="margin-top: 1rem; display: flex; gap: 0.5rem; justify-content: center; width: 100%;">
                                <input type="text" id="type-input" autocomplete="off" placeholder="Zadejte příkaz..." style="text-align: center; text-transform: uppercase; font-family: var(--font-mono); font-weight: bold; width: 100%; max-width: 300px; padding: 0.75rem 1rem;" disabled>
                                <button class="btn btn-action" id="btn-type-reset" style="padding: 0.5rem 1.2rem; font-size: 0.75rem;">RESTART</button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
