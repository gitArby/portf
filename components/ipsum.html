<!-- Ipsum View -->
        <div id="ipsum-view" class="dashboard-view">
            <section class="container reveal">
                <h3 class="reveal-stagger" style="--stagger-delay: 1">Arby Ipsum Generator</h3>
                <p class="section-desc reveal-stagger" style="--stagger-delay: 2">Proč používat nudnou latinu, když si můžeš vygenerovat pravý "Nerd" výplňový text plný RGB a síťařiny?</p>
                
                <div class="ipsum-controls reveal-stagger" style="--stagger-delay: 3">
                    <div class="ipsum-input-group">
                        <label for="ipsum-paragraphs">Počet odstavců:</label>
                        <input type="number" id="ipsum-paragraphs" min="1" max="10" value="3">
                    </div>
                    <button class="btn" id="btn-generate-ipsum">
                        <i class="fa-solid fa-bolt"></i> Generovat Arby Ipsum
                    </button>
                    <button class="btn btn-cv" id="btn-copy-ipsum">
                        <i class="fa-solid fa-copy"></i> Kopírovat
                    </button>
                </div>
                
                <div class="ipsum-output-box reveal-stagger" style="--stagger-delay: 4">
                    <div id="ipsum-output" class="ipsum-text">
                        Klikni na tlačítko "Generovat" pro vytvoření textu...
                    </div>
                </div>
            </section>
        </div>
